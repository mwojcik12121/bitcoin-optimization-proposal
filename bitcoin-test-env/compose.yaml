      args:
        CORE_IMAGE: ${CORE_IMAGE:-bitcoin-env/core-source:local}
        NODE_ID: "02"
        NODE_ROLE: miner
    environment:
      <<: *node-environment
      NODE_ID: "02"
      NODE_NAME: node02
      NODE_ROLE: miner

  node03:
